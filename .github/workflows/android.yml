name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build:native
        env:
          APP_VERSION: ${{ github.sha }}
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: TimeSheet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TimeSheet.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TimeSheet APK (dernière version)
          body: |
            APK Android de TimeSheet, rebuild automatiquement à chaque push
            sur main. Télécharger TimeSheet.apk ci-dessous et l'installer
            sur le téléphone (autoriser les sources inconnues).

            version: ${{ github.sha }}
          files: TimeSheet.apk
